[project]
name = "minimal-agent-example"
version = "0.0.0"
description = "Runnable example app for mini-agent-kit (local, editable)."
requires-python = ">=3.11"
# Depends on the local package (with the server extra for App.serve()) rather
# than the PyPI release — see [tool.uv.sources] below for the editable wiring.
dependencies = [
    "mini-agent-kit[server]",
]

# This example is a set of runnable scripts, not an importable package, so it
# isn't built/installed itself — only its dependencies are.
[tool.uv]
package = false

# Point the dependency at the sibling source checkout, installed editable, so
# changes under ../minimal_agent are picked up without a reinstall. `uv sync`
# in this directory builds the venv against the local package.
[tool.uv.sources]
mini-agent-kit = { path = "../minimal_agent", editable = true }
