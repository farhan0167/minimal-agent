[project]
name = "mini-agent-kit"
version = "0.1.12"
description = "General purpose agent harness inspired by Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Farhan Ishraq" }]
keywords = ["agent", "llm", "ai", "tools", "agent-harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/farhan0167/minimal-agent"
Repository = "https://github.com/farhan0167/minimal-agent"
Documentation = "https://github.com/farhan0167/minimal-agent#readme"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
]
# PDF attachment/reading support. Kept out of `server` because pdf2image
# also needs system poppler — installing it without poppler would make the
# feature detection advertise support that fails at conversion time.
pdf = [
    "pdf2image>=1.17.0",
]
mcp = [
    "mcp>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution name is `mini-agent-kit`, but the import package is
# `minimal_agent` — tell uv_build not to derive the module name from the
# distribution name.
module-name = "minimal_agent"

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules, pycodestyle (`E`/`W`), isort (`I`), and more
select = ["E", "F", "B", "I", "W"]
ignore = ["B008"]
# Avoid auto-fixing these errors
unfixable = []
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    "__pypackages__",
    "dist",
    "venv",
    ".venv",
    "build",
    "node_modules",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    # Server-extra stack + httpx so the App tests can run TestClient.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    "httpx>=0.27.0",
    # pdf extra, so the dev env covers PDF reading/attachments end to end
    # (real conversion also needs system poppler).
    "pdf2image>=1.17.0",
    # mcp extra, so the dev env covers the MCP tool tests (in-memory + stdio).
    "mcp>=1.9.0",
]
