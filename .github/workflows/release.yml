name: Release

# Publishes to PyPI when a GitHub Release is published.
# Drafting and publishing a Release in the GitHub UI creates the vX.Y.Z
# tag for you — there are no `git tag` commands to remember. The release
# notes live alongside the publish in one step.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored in the repo.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI into the package
        run: make ui

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.12"

      - name: Verify the release tag matches the package version
        working-directory: minimal_agent
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME ($tag) does not match pyproject version ($pkg). Bump the version in minimal_agent/pyproject.toml before drafting the release."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build
        working-directory: minimal_agent

      - name: Check distribution metadata
        run: uvx twine check minimal_agent/dist/*

      - name: Verify the UI landed in the wheel
        run: unzip -l minimal_agent/dist/*.whl | grep "minimal_agent/server/static/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: minimal_agent/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mini-agent-kit/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
